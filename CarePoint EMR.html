<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>CarePoint EMR</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f3f6fa;--card:#fff;--tx:#1b2733;--mu:#64748b;--pr:#1f6feb;--pr2:#e8f0fe;--bd:#dde4ee;--ok:#15803d;--wa:#b45309;--er:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1720;--card:#17212d;--tx:#e6edf5;--mu:#93a1b3;--pr:#5aa2ff;--pr2:#1b2c45;--bd:#2a394b;--ok:#4ade80;--wa:#fbbf24;--er:#f87171}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
#app{display:flex;min-height:100vh}nav{width:210px;background:var(--card);border-right:1px solid var(--bd);padding:14px 10px;flex-shrink:0}
nav h1{font-size:17px;margin:0 6px 14px;color:var(--pr)}nav a{display:block;padding:9px 10px;border-radius:8px;color:var(--tx);cursor:pointer;margin-bottom:2px}
nav a.on,nav a:hover{background:var(--pr2);color:var(--pr)}main{flex:1;padding:18px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px;flex-wrap:wrap}.top h2{margin:0;font-size:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}.card h3{margin:0 0 10px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}.stat b{font-size:24px;display:block;color:var(--pr)}.stat span{color:var(--mu);font-size:12px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
button,select,input,textarea{font:inherit;color:var(--tx)}button{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:7px 12px;cursor:pointer}button.s{background:var(--pr2);color:var(--pr)}button.d{background:transparent;color:var(--er);border:1px solid var(--er)}button.sm{padding:3px 8px;font-size:12px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}.err{color:var(--er);font-size:12px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{font-size:12px;color:var(--mu);font-weight:600}
.b{padding:2px 8px;border-radius:99px;font-size:11px;background:var(--pr2);color:var(--pr)}.b.ok{color:var(--ok)}.b.wa{color:var(--wa)}.b.er{color:var(--er)}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0}.bar i{display:block;height:10px;background:var(--pr);border-radius:5px}.bar span{width:130px;font-size:12px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:20}#modal>div{background:var(--card);border-radius:12px;padding:16px;width:min(520px,100%)}
.login{max-width:360px;margin:8vh auto;padding:0 14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto}
.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 14px}.dg div span{display:block;font-size:11px;color:var(--mu)}
#toast{position:fixed;bottom:16px;right:16px;background:var(--tx);color:var(--bg);padding:9px 14px;border-radius:8px;display:none;z-index:30}
@media(max-width:720px){#app{flex-direction:column}nav{width:auto;display:flex;overflow-x:auto;gap:4px;padding:8px}nav h1{display:none}nav a{white-space:nowrap;margin:0}}
@media print{body *{visibility:hidden}#modal,#modal *{visibility:visible}#modal{position:absolute;background:#fff;color:#000;display:block}.np{display:none!important}}
</style></head><body><div id="app"></div><div id="modal"><div></div></div><div id="toast"></div>
<script>
const KEY='carepoint_emr_v1',$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dstr=o=>{const d=new Date();d.setDate(d.getDate()+o);return d.toISOString().slice(0,10)},td=()=>dstr(0);
const age=d=>Math.floor((Date.now()-new Date(d))/31557600000);
async function h(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('emr:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return'x'+btoa(s)}}
let S,ME=null,ui={v:'dash',pid:null,q:'',f:'Today'},last=Date.now();
const ROLES={admin:'System Administrator',doctor:'Doctor',nurse:'Nurse',reception:'Receptionist',lab:'Laboratory Technician'};
const NAV={dash:['Dashboard','admin doctor nurse reception lab'],pat:['Patients','admin doctor nurse reception'],appt:['Appointments','admin doctor nurse reception'],doc:['Doctors','admin doctor nurse reception'],rx:['Prescriptions','admin doctor nurse'],lab:['Laboratory','admin doctor nurse lab'],img:['Imaging','admin doctor lab'],rep:['Reports','admin doctor'],audit:['Audit log','admin']};
const W={pat:'admin reception doctor nurse',appt:'admin reception doctor nurse',vit:'admin doctor nurse',note:'admin doctor nurse',rx:'doctor',labreq:'admin doctor',labupd:'admin lab',img:'admin doctor lab',docadd:'admin'};
const can=k=>W[k].split(' ').includes(ME.role);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500)}
function log(a){S.audit.unshift({t:new Date().toLocaleString(),u:ME.name,r:ME.role,a});S.audit=S.audit.slice(0,300);save()}
async function seed(){const p=await h('Demo@123');
S={users:[['Dr. Asha Menon','asha','doctor'],['Nurse Kavya R','kavya','nurse'],['Ravi Kumar','ravi','reception'],['Lab Tech Imran','imran','lab'],['Admin Meera','admin','admin']].map(([name,u,role])=>({name,u,role,p})),
docs:[{id:'D1',name:'Dr. Asha Menon',spec:'Cardiology',dept:'Cardiology',qual:'MD, DM',exp:12,avail:true},{id:'D2',name:'Dr. Vikram Rao',spec:'General Medicine',dept:'Internal Medicine',qual:'MD',exp:8,avail:true},{id:'D3',name:'Dr. Lakshmi Iyer',spec:'Paediatrics',dept:'Paediatrics',qual:'MD, DCH',exp:15,avail:false}],
patients:[['Arun Prakash','1985-04-12','Male','9840011122','arun@example.com','12 Lake View Rd, Chennai','Divya P – 9840011133','B+','Penicillin','Hypertension','D1','Outpatient'],['Sneha Nair','1992-09-03','Female','9840022233','sneha@example.com','5 Temple St, Chennai','Rahul N – 9840022244','O+','None','Asthma','D2','Admitted'],['Mohan Das','1958-01-25','Male','9840033344','','88 Beach Rd, Chennai','Latha D – 9840033355','A+','Sulfa drugs','Type 2 diabetes','D2','Admitted'],['Priya Shankar','2016-07-19','Female','9840044455','','3 Park Ave, Chennai','Shankar S – 9840044466','AB+','None','Recurrent tonsillitis','D3','Discharged'],['Farhan Ali','1979-12-02','Male','9840055566','farhan@example.com','41 Mount Rd, Chennai','Zoya A – 9840055577','O-','Aspirin','Coronary artery disease','D1','Outpatient']].map((a,i)=>({id:'P'+(1001+i),name:a[0],dob:a[1],gender:a[2],phone:a[3],email:a[4],addr:a[5],emerg:a[6],blood:a[7],allergies:a[8],history:a[9],doctor:a[10],adm:a[11],archived:false,created:dstr(-10+i*2)})),
appts:[['P1001','D1',0,'10:00','Follow-up','Scheduled'],['P1002','D2',0,'11:30','Breathlessness review','Scheduled'],['P1005','D1',1,'09:30','ECG review','Scheduled'],['P1003','D2',-2,'14:00','Diabetes check','Completed']].map((a,i)=>({id:'A'+(i+1),pid:a[0],did:a[1],date:dstr(a[2]),time:a[3],reason:a[4],status:a[5]})),
vitals:[{id:'V1',pid:'P1001',date:td(),bp:'138/88',hr:78,temp:36.8,rr:16,spo2:98}],
notes:[{id:'N1',pid:'P1001',date:td(),dx:'Hypertension',sym:'Occasional headache',exam:'No focal deficit',plan:'Lifestyle changes, review in 2 weeks',doctor:'Dr. Asha Menon'},{id:'N2',pid:'P1003',date:dstr(-2),dx:'Type 2 diabetes',sym:'Fatigue',exam:'Stable',plan:'Adjust medication',doctor:'Dr. Vikram Rao'}],
rx:[{id:'R1',pid:'P1001',did:'D1',date:td(),dx:'Hypertension',med:'Amlodipine 5 mg',dose:'1 tablet',freq:'Once daily',dur:'30 days',ins:'Take in the morning'}],
labs:[{id:'L1',pid:'P1003',cat:'Biochemistry',test:'HbA1c',sample:'Blood',date:dstr(-1),status:'Completed',result:'7.9 %'},{id:'L2',pid:'P1001',cat:'Biochemistry',test:'Lipid profile',sample:'Blood',date:td(),status:'Sample Collected',result:''},{id:'L3',pid:'P1002',cat:'Haematology',test:'CBC',sample:'Blood',date:td(),status:'Requested',result:''}],
imgs:[{id:'I1',pid:'P1005',type:'X-ray',date:dstr(-3),body:'Chest',report:'No acute cardiopulmonary abnormality.'}],audit:[]};save()}
async function init(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S)await seed();render()}
const pn=id=>(S.patients.find(p=>p.id==id)||{}).name||id,dn=id=>(S.docs.find(d=>d.id==id)||{}).name||id;
const tbl=(hd,rows)=>`<div class="tw"><table><tr>${hd.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${hd.length}" style="color:var(--mu)">No records found.</td></tr>`}</table></div>`;
const bdg=s=>`<span class="b ${/Complet|Discharg|Available/.test(s)?'ok':/Cancel/.test(s)?'er':/Request|Admit|Unavail/.test(s)?'wa':''}">${esc(s)}</span>`;
const bars=(o,csv)=>{const e=Object.entries(o),m=Math.max(1,...e.map(x=>x[1]));return(e.length?e.map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><i style="width:${v/m*55+2}%"></i><b>${v}</b></div>`).join(''):'<p style="color:var(--mu)">No data yet.</p>')+`<button class="s sm np" data-a="csv" data-id='${esc(JSON.stringify(o))}'>Download CSV</button>`};
const cnt=(a,f)=>a.reduce((o,x)=>{const k=f(x)||'Unspecified';o[k]=(o[k]||0)+1;return o},{});
/* views */
const V={
dash(){const ap=S.appts.filter(a=>a.date==td()),pl=S.labs.filter(l=>l.status!='Completed'),pa=S.patients.filter(p=>!p.archived);
return`<div class="grid">${[[pa.length,'Registered patients'],[ap.length,'Today\u2019s appointments'],[S.docs.filter(d=>d.avail).length,'Doctors available'],[pl.length,'Pending lab reports'],[pa.filter(p=>p.adm=='Admitted').length,'Currently admitted'],[pa.filter(p=>p.adm=='Discharged').length,'Discharged']].map(x=>`<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div>
<div class="g2"><div class="card"><h3>Today\u2019s schedule</h3>${tbl(['Time','Patient','Doctor','Status'],ap.map(a=>[a.time,pn(a.pid),dn(a.did),bdg(a.status)]))}</div>
<div class="card"><h3>Alerts</h3>${[...ap.filter(a=>a.status=='Scheduled').map(a=>`Reminder: ${pn(a.pid)} at ${a.time} with ${dn(a.did)}`),...pl.map(l=>`Pending lab: ${l.test} for ${pn(l.pid)} (${l.status})`),...pa.filter(p=>p.allergies&&p.allergies!='None'&&p.adm=='Admitted').map(p=>`Allergy alert: ${p.name} – ${p.allergies}`)].map(x=>`<p style="margin:6px 0">• ${esc(x)}</p>`).join('')||'<p>No alerts.</p>'}</div></div>
<div class="card"><h3>Recent registrations</h3>${tbl(['ID','Name','Registered','Status'],[...pa].sort((a,b)=>b.created.localeCompare(a.created)).slice(0,5).map(p=>[p.id,esc(p.name),p.created,bdg(p.adm)]))}</div>
<div class="card"><h3>Appointments by status</h3>${bars(cnt(S.appts,a=>a.status))}</div>`},
pat(){if(ui.pid)return V.det();const q=ui.q.toLowerCase(),ar=ui.f=='Archived';
const L=S.patients.filter(p=>p.archived==ar&&(p.name+p.id+p.phone).toLowerCase().includes(q));
return`<div class="row" style="margin-bottom:12px"><input id="q" style="max-width:260px" placeholder="Search name, ID or phone" value="${esc(ui.q)}"><select id="fl" style="width:auto"><option>Active</option><option ${ar?'selected':''}>Archived</option></select>${can('pat')?'<button data-a="padd">+ Register patient</button>':''}</div><div class="card">${tbl(['ID','Name','Age','Gender','Blood','Phone','Status',''],L.map(p=>[p.id,esc(p.name),age(p.dob),p.gender,p.blood,esc(p.phone),bdg(p.adm),`<button class="s sm" data-a="pview" data-id="${p.id}">Open</button>`]))}</div>`},
det(){const p=S.patients.find(x=>x.id==ui.pid),f=k=>S[k].filter(x=>x.pid==p.id);
return`<div class="row" style="margin-bottom:12px"><button class="s" data-a="pback">\u2190 Back</button>${can('pat')?`<button class="s" data-a="pedit" data-id="${p.id}">Edit</button><button class="d" data-a="parch" data-id="${p.id}">${p.archived?'Restore':'Archive'}</button>`:''}</div>
<div class="card"><h3>${esc(p.name)} \u00b7 ${p.id} ${bdg(p.adm)}</h3><div class="dg">${[['Age / DOB',age(p.dob)+' yrs / '+p.dob],['Gender',p.gender],['Blood group',p.blood],['Phone',p.phone],['Email',p.email||'–'],['Address',p.addr],['Emergency contact',p.emerg],['Allergies',p.allergies||'–'],['Medical history',p.history||'–'],['Primary doctor',dn(p.doctor)]].map(x=>`<div><span>${x[0]}</span>${esc(x[1])}</div>`).join('')}</div></div>
<div class="card"><div class="row" style="justify-content:space-between"><h3>Vital signs</h3>${can('vit')?'<button class="sm" data-a="vadd">+ Add</button>':''}</div>${tbl(['Date','BP','HR','Temp \u00b0C','RR','SpO\u2082 %'],f('vitals').map(v=>[v.date,v.bp,v.hr,v.temp,v.rr,v.spo2]))}</div>
<div class="card"><div class="row" style="justify-content:space-between"><h3>Clinical notes and diagnoses</h3>${can('note')?'<button class="sm" data-a="nadd">+ Add</button>':''}</div>${tbl(['Date','Diagnosis','Symptoms','Examination','Treatment / follow-up','By'],f('notes').map(n=>[n.date,esc(n.dx),esc(n.sym),esc(n.exam),esc(n.plan),esc(n.doctor)]))}</div>
<div class="card"><h3>Prescriptions</h3>${tbl(['Date','Medication','Frequency','Duration'],f('rx').map(r=>[r.date,esc(r.med),esc(r.freq),esc(r.dur)]))}</div>
<div class="card"><h3>Laboratory results</h3>${tbl(['Date','Test','Status','Result'],f('labs').map(l=>[l.date,esc(l.test),bdg(l.status),esc(l.result||'–')]))}</div>
<div class="card"><h3>Imaging history</h3>${tbl(['Date','Type','Region','Report'],f('imgs').map(i=>[i.date,i.type,esc(i.body),esc(i.report)]))}</div>`},
appt(){const q=ui.q.toLowerCase(),t=td(),w=dstr(7),m=dstr(30);
const L=S.appts.filter(a=>(ui.f=='All'||(ui.f=='Today'?a.date==t:ui.f=='Week'?a.date>=t&&a.date<=w:a.date>=t&&a.date<=m))&&(pn(a.pid)+dn(a.did)).toLowerCase().includes(q)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
return`<div class="row" style="margin-bottom:12px"><input id="q" style="max-width:240px" placeholder="Search patient or doctor" value="${esc(ui.q)}"><select id="fl" style="width:auto">${['Today','Week','Month','All'].map(x=>`<option ${ui.f==x?'selected':''}>${x}</option>`).join('')}</select>${can('appt')?'<button data-a="aadd">+ Schedule</button>':''}</div><div class="card">${tbl(['Date','Time','Patient','Doctor','Reason','Status',''],L.map(a=>[a.date,a.time,pn(a.pid),dn(a.did),esc(a.reason),bdg(a.status),can('appt')&&a.status=='Scheduled'?`<button class="sm" data-a="adone" data-id="${a.id}">Complete</button> <button class="d sm" data-a="acanc" data-id="${a.id}">Cancel</button>`:'']))}</div>`},
doc(){return`${can('docadd')?'<button data-a="dadd" style="margin-bottom:12px">+ Add doctor</button>':''}<div class="card">${tbl(['Name','Specialisation','Department','Qualification','Experience','Assigned patients','Availability'],S.docs.map(d=>[esc(d.name),esc(d.spec),esc(d.dept),esc(d.qual),d.exp+' yrs',S.patients.filter(p=>p.doctor==d.id&&!p.archived).length,(can('docadd')||ME.name==d.name)?`<button class="s sm" data-a="dtog" data-id="${d.id}">${d.avail?'Available':'Unavailable'}</button>`:bdg(d.avail?'Available':'Unavailable')]))}</div>`},
rx(){return`${can('rx')?'<button data-a="rxadd" style="margin-bottom:12px">+ New prescription</button>':''}<div class="card">${tbl(['Date','Patient','Doctor','Medication','Duration',''],S.rx.map(r=>[r.date,pn(r.pid),dn(r.did),esc(r.med),esc(r.dur),`<button class="s sm" data-a="rxprint" data-id="${r.id}">Print / PDF</button>`]))}</div>`},
lab(){return`${can('labreq')?'<button data-a="ladd" style="margin-bottom:12px">+ Request test</button>':''}<div class="card">${tbl(['Date','Patient','Category','Test','Sample','Status','Result',''],S.labs.map(l=>[l.date,pn(l.pid),l.cat,esc(l.test),l.sample,bdg(l.status),esc(l.result||'–'),can('labupd')?`<button class="s sm" data-a="lupd" data-id="${l.id}">Update</button>`:'']))}</div>`},
img(){return`${can('img')?'<button data-a="iadd" style="margin-bottom:12px">+ Add imaging report</button>':''}<div class="card">${tbl(['Date','Patient','Type','Region','Report'],S.imgs.map(i=>[i.date,pn(i.pid),i.type,esc(i.body),esc(i.report)]))}</div>`},
rep(){const P=S.patients;return`<div class="g2"><div class="card"><h3>Patient registrations by month</h3>${bars(cnt(P,p=>p.created.slice(0,7)))}</div><div class="card"><h3>Common diagnoses</h3>${bars(cnt(S.notes,n=>n.dx))}</div><div class="card"><h3>Laboratory tests by category</h3>${bars(cnt(S.labs,l=>l.cat))}</div><div class="card"><h3>Appointments per department</h3>${bars(cnt(S.appts,a=>(S.docs.find(d=>d.id==a.did)||{}).dept))}</div><div class="card"><h3>Admission and discharge</h3>${bars(cnt(P,p=>p.adm))}</div></div>`},
audit(){return`<div class="card">${tbl(['Time','User','Role','Action'],S.audit.map(a=>[a.t,esc(a.u),a.r,esc(a.a)]))}</div>`}};
/* forms */
const fld=(k,l,t,o,v)=>`<label>${l}</label>${t=='select'?`<select data-k="${k}">${o.map(x=>{const a=Array.isArray(x)?x:[x,x];return`<option value="${esc(a[0])}" ${a[0]==v?'selected':''}>${esc(a[1])}</option>`}).join('')}</select>`:t=='area'?`<textarea data-k="${k}" rows="2">${esc(v||'')}</textarea>`:`<input data-k="${k}" type="${t||'text'}" value="${esc(v??'')}">`}`;
function form(title,fs,ok,v={}){const m=$('#modal');m.firstElementChild.innerHTML=`<h3>${title}</h3>${fs.map(f=>fld(f[0],f[1],f[2],f[3],v[f[0]])).join('')}<p class="err" id="fe"></p><div class="row"><button data-a="fsave">Save</button><button class="s" data-a="mclose">Cancel</button></div>`;m.style.display='flex';m._ok=ok;m._fs=fs}
function fsave(){const m=$('#modal'),o={};m.querySelectorAll('[data-k]').forEach(e=>o[e.dataset.k]=e.value.trim());const miss=m._fs.find(f=>f[4]&&!o[f[0]]);
const er=miss?miss[1]+' is required':m._ok(o);if(er){$('#fe').textContent=er;return}save();mclose();render()}
const mclose=()=>{$('#modal').style.display='none'},pOpts=()=>S.patients.filter(p=>!p.archived).map(p=>[p.id,p.id+' – '+p.name]),dOpts=()=>S.docs.map(d=>[d.id,d.name]);
const A={
padd(){pform()},pedit(id){pform(S.patients.find(p=>p.id==id))},
pview(id){ui.pid=id;log('Viewed record '+id);render()},pback(){ui.pid=null;render()},
parch(id){const p=S.patients.find(x=>x.id==id);p.archived=!p.archived;log((p.archived?'Archived ':'Restored ')+id);save();ui.pid=null;render()},
vadd(){form('Add vital signs',[['bp','Blood pressure (mmHg)','text',0,1],['hr','Heart rate (bpm)','number',0,1],['temp','Temperature (\u00b0C)','number',0,1],['rr','Respiratory rate','number',0,1],['spo2','SpO\u2082 (%)','number',0,1]],o=>{if(!/^\d{2,3}\/\d{2,3}$/.test(o.bp))return'BP must look like 120/80';if(o.spo2<50||o.spo2>100)return'SpO\u2082 must be 50–100';S.vitals.push({id:'V'+Date.now(),pid:ui.pid,date:td(),...o});log('Added vitals '+ui.pid)})},
nadd(){form('Add clinical note',[['dx','Diagnosis','text',0,1],['sym','Current symptoms','area'],['exam','Examination notes','area'],['plan','Treatment plan / follow-up','area']],o=>{S.notes.push({id:'N'+Date.now(),pid:ui.pid,date:td(),...o,doctor:ME.name});log('Added clinical note '+ui.pid)})},
aadd(){form('Schedule appointment',[['pid','Patient','select',pOpts()],['did','Doctor','select',dOpts()],['date','Date','date',0,1],['time','Time','time',0,1],['reason','Reason','text']],o=>{if(o.date<td())return'Date cannot be in the past';const d=S.docs.find(x=>x.id==o.did);if(!d.avail)return d.name+' is currently unavailable';if(S.appts.some(a=>a.did==o.did&&a.date==o.date&&a.time==o.time&&a.status=='Scheduled'))return'That slot is already booked';S.appts.push({id:'A'+Date.now(),...o,status:'Scheduled'});log('Scheduled appointment '+o.pid)})},
adone(id){S.appts.find(a=>a.id==id).status='Completed';save();render()},acanc(id){S.appts.find(a=>a.id==id).status='Cancelled';save();render()},
dadd(){form('Add doctor',[['name','Name','text',0,1],['spec','Specialisation','text',0,1],['dept','Department','text',0,1],['qual','Qualification','text'],['exp','Experience (years)','number']],o=>{S.docs.push({id:'D'+Date.now(),...o,exp:+o.exp||0,avail:true});log('Added doctor '+o.name)})},
dtog(id){const d=S.docs.find(x=>x.id==id);d.avail=!d.avail;save();render()},
rxadd(){form('New prescription',[['pid','Patient','select',pOpts()],['dx','Diagnosis','text',0,1],['med','Medication','text',0,1],['dose','Dosage','text',0,1],['freq','Frequency','text',0,1],['dur','Duration','text',0,1],['ins','Instructions','area']],o=>{const d=S.docs.find(x=>x.name==ME.name)||S.docs[0];S.rx.push({id:'R'+Date.now(),did:d.id,date:td(),...o});log('Prescribed for '+o.pid)})},
rxprint(id){const r=S.rx.find(x=>x.id==id),p=S.patients.find(x=>x.id==r.pid),m=$('#modal');log('Opened prescription '+id);m.firstElementChild.innerHTML=`<h3>\u2695 CarePoint Hospital – Prescription</h3><p><b>Patient:</b> ${esc(p.name)} (${p.id}), ${age(p.dob)} yrs, ${p.gender}<br><b>Doctor:</b> ${esc(dn(r.did))}<br><b>Date:</b> ${r.date}<br><b>Diagnosis:</b> ${esc(r.dx)}</p><p><b>Rx:</b> ${esc(r.med)} – ${esc(r.dose)}, ${esc(r.freq)} for ${esc(r.dur)}</p><p><b>Instructions:</b> ${esc(r.ins||'–')}</p><div class="row np"><button data-a="pr">Print / Save as PDF</button><button class="s" data-a="mclose">Close</button></div>`;m.style.display='flex'},
pr(){window.print()},
ladd(){form('Request lab test',[['pid','Patient','select',pOpts()],['cat','Category','select',['Haematology','Biochemistry','Microbiology','Pathology']],['test','Test name','text',0,1],['sample','Sample','select',['Blood','Urine','Stool','Swab']]],o=>{S.labs.push({id:'L'+Date.now(),...o,date:td(),status:'Requested',result:''});log('Lab requested '+o.pid)})},
lupd(id){const l=S.labs.find(x=>x.id==id);form('Update '+l.test,[['status','Status','select',['Requested','Sample Collected','In Progress','Completed']],['result','Result / report','area']],o=>{if(o.status=='Completed'&&!o.result)return'Enter the result to complete the test';Object.assign(l,o);log('Lab updated '+id)},l)},
iadd(){form('Add imaging report',[['pid','Patient','select',pOpts()],['type','Modality','select',['X-ray','CT','MRI','Ultrasound']],['body','Body region','text',0,1],['report','Findings / report','area',0,1]],o=>{S.imgs.push({id:'I'+Date.now(),...o,date:td()});log('Imaging added '+o.pid)})},
fsave,mclose,
csv(id,t){const o=JSON.parse(t.dataset.id),b=new Blob(['Item,Count\n'+Object.entries(o).map(e=>`"${e[0]}",${e[1]}`).join('\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='report.csv';a.click()},
nav(id){ui.v=id;ui.pid=null;ui.q='';ui.f=id=='appt'?'Today':'Active';render()},
out(){log('Logout');ME=null;render()}};
function pform(p){const v=p||{};form(p?'Edit patient':'Register patient',[['name','Full name','text',0,1],['dob','Date of birth','date',0,1],['gender','Gender','select',['Female','Male','Other']],['phone','Contact number','tel',0,1],['email','Email','email'],['addr','Residential address','text'],['emerg','Emergency contact','text',0,1],['blood','Blood group','select',['A+','A-','B+','B-','AB+','AB-','O+','O-']],['allergies','Known allergies','text'],['history','Medical history','area'],['doctor','Primary doctor','select',dOpts()],['adm','Status','select',['Outpatient','Admitted','Discharged']]],o=>{if(isNaN(new Date(o.dob))||o.dob>td())return'Enter a valid date of birth';if(!/^[+\d][\d\s-]{7,14}$/.test(o.phone))return'Enter a valid phone number';if(o.email&&!/^\S+@\S+\.\S+$/.test(o.email))return'Enter a valid email';if(p){Object.assign(p,o);log('Edited patient '+p.id)}else{const id='P'+(1001+S.patients.length);S.patients.push({id,...o,archived:false,created:td()});log('Registered patient '+id)}},v)}
/* shell */
function render(){const a=$('#app');if(!ME){a.innerHTML=`<div class="login"><div class="card"><h2 style="color:var(--pr)">CarePoint EMR</h2><p style="color:var(--mu)">Sign in to continue. Demo data is fictional.</p><label>Username</label><input id="u" autocomplete="username"><label>Password</label><input id="pw" type="password" autocomplete="current-password"><p class="err" id="le"></p><button data-a="login" style="width:100%">Sign in</button><p style="font-size:12px;color:var(--mu)">Demo password: Demo@123<br>Users: ${S.users.map(u=>u.u+' ('+u.role+')').join(', ')}</p></div></div>`;return}
const items=Object.entries(NAV).filter(([k,v])=>v[1].split(' ').includes(ME.role));
a.innerHTML=`<nav><h1>\u2695 CarePoint EMR</h1>${items.map(([k,v])=>`<a data-a="nav" data-id="${k}" class="${ui.v==k?'on':''}">${v[0]}</a>`).join('')}<a data-a="out">Sign out</a></nav><main><div class="top"><h2>${NAV[ui.v][0]}</h2><span style="color:var(--mu)">${esc(ME.name)} \u00b7 ${ROLES[ME.role]}</span></div>${V[ui.v]()}</main>`}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;if(t.dataset.a=='login')return login();A[t.dataset.a]&&A[t.dataset.a](t.dataset.id,t)});
document.addEventListener('input',e=>{if(e.target.id!='q')return;ui.q=e.target.value;const c=e.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(c,c)});
document.addEventListener('change',e=>{if(e.target.id=='fl'){ui.f=e.target.value;render()}});
async function login(){const u=S.users.find(x=>x.u==$('#u').value.trim().toLowerCase());if(!u||u.p!=await h($('#pw').value)){$('#le').textContent='Invalid username or password';return}ME=u;ui={v:'dash',pid:null,q:'',f:'Today'};last=Date.now();log('Login');render()}
['click','keydown','touchstart'].forEach(ev=>addEventListener(ev,()=>last=Date.now()));
setInterval(()=>{if(ME&&Date.now()-last>600000){log('Session timeout');ME=null;render();toast('Signed out after 10 minutes of inactivity')}},15000);
init();
</script></body></html>
